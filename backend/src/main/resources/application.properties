spring.application.name=demo

# Conexion a la base de datos MySQL local.
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_demo
spring.datasource.username=root
spring.datasource.password=root

# validate comprueba que las tablas coincidan con las entidades, pero no las crea ni modifica.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en consola las consultas SQL que genera Hibernate.
spring.jpa.show-sql=true
