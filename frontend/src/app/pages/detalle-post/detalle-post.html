<div class="detail-page">
  <header class="page-header">
    <h1>Detalle de post</h1>
  </header>

  <!-- Mientras post() sea null, se muestra el estado de carga. -->
  @if (post() !== null) {
    <div class="detail-card">
      <h2>{{ post()!.titulo }}</h2>
      <div class="detail-data">
        <p><span>ID</span>{{ post()!.id }}</p>
        <p><span>Autor</span>{{ post()!.nombreUsuario }}</p>
      </div>
    </div>

    <section class="post-content-panel">
      <div class="posts-header">
        <span>Contenido</span>
        <h3>{{ post()!.titulo }}</h3>
      </div>

      <p class="post-content">{{ post()!.contenido }}</p>
    </section>
  } @else {
    <p>Cargando post...</p>
  }

  <!-- Mensaje de error si falla la llamada HTTP. -->
  @if (mensaje !== '') {
    <p class="error">{{ mensaje }}</p>
  }

  <a routerLink="/usuarios" class="back-button">Volver a usuarios</a>
</div>
