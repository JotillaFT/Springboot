<h1>Editar Usuario</h1>

<form #usuarioForm="ngForm" (ngSubmit)="actualizarUsuario()">

  <div>
    <label>Nombre:</label>
    <input
      type="text"
      name="nombre"
      [(ngModel)]="nombre"
      #nombreInput="ngModel"
      required
      minlength="2"
    >

    @if (nombreInput.invalid && nombreInput.touched) {
      <p class="error">El nombre es obligatorio y debe tener al menos 2 caracteres</p>
    }
  </div>

  <div>
    <label>Edad:</label>
    <input
      type="number"
      name="edad"
      [(ngModel)]="edad"
      #edadInput="ngModel"
      required
      min="0"
      max="120"
    >

    @if (edadInput.invalid && edadInput.touched) {
      <p class="error">La edad debe estar entre 0 y 120</p>
    }
  </div>

  <button type="submit" [disabled]="usuarioForm.invalid">
    Guardar cambios
  </button>
</form>

@if (mensaje !== '') {
  <p class="error">{{ mensaje }}</p>
}

<br>

<a [routerLink]="['/usuarios', id]">Volver al detalle</a>
