<section class="page edit-page">
  <header class="page-header">
    <h1>Editar Usuario</h1>
  </header>

  <!-- Formulario cargado previamente desde el backend y enviado por PUT al guardar. -->
  <form #usuarioForm="ngForm" (ngSubmit)="actualizarUsuario()" class="digi-form">
    <div class="field">
      <label>Nombre:</label>
      <input
        type="text"
        name="nombre"
        [(ngModel)]="nombre"
        #nombreInput="ngModel"
        required
        minlength="2"
      />

      @if (nombreInput.invalid && nombreInput.touched) {
        <p class="error">El nombre es obligatorio y debe tener al menos 2 caracteres</p>
      }
    </div>

    <div class="field">
      <label>Edad:</label>
      <input
        type="number"
        name="edad"
        [(ngModel)]="edad"
        #edadInput="ngModel"
        required
        min="0"
        max="120"
      />

      @if (edadInput.invalid && edadInput.touched) {
        <p class="error">La edad debe estar entre 0 y 120</p>
      }
    </div>

    <button type="submit" [disabled]="usuarioForm.invalid">Guardar cambios</button>
  </form>

  <!-- Mensaje unico para errores de carga, validacion local o actualizacion. -->
  @if (mensaje !== '') {
    <p class="error form-message">{{ mensaje }}</p>
  }

  <a [routerLink]="['/usuarios', id]" class="back-button">Volver al detalle</a>
</section>
